<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;800&family=Spline+Sans+Mono:wght@400;500&display=swap">
<style>
/* ---------- design tokens (every text pair is >= 4.5:1, most >= 7:1; verified by script and shown live in Settings) ---------- */
:root{--bg:#F3F5F8;--surface:#FFFFFF;--surface2:#E9EEF4;--ink:#0F1A26;--muted:#455363;--border:#6B7A8C;--line:#CBD3DC;
 --accent:#1B4DB1;--onaccent:#FFFFFF;--accentbg:#E3ECFB;--danger:#A8161F;--dangerbg:#FBE9EA;--ok:#0A6650;--okbg:#E2F3EE;--warn:#6F4400;--warnbg:#FFF1D6;--focus:#0A3EA8;
 --scale:1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="contrast"]){--bg:#0E141B;--surface:#151D27;--surface2:#1D2733;--ink:#EAF0F6;--muted:#A9B6C4;--border:#7E8FA3;--line:#2F3D4D;--accent:#8DB4FF;--onaccent:#08142B;--accentbg:#1B2A46;--danger:#FF8A82;--dangerbg:#3A1618;--ok:#5FD3B8;--okbg:#0F2E27;--warn:#F0BE5B;--warnbg:#35280A;--focus:#FFD166;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E141B;--surface:#151D27;--surface2:#1D2733;--ink:#EAF0F6;--muted:#A9B6C4;--border:#7E8FA3;--line:#2F3D4D;--accent:#8DB4FF;--onaccent:#08142B;--accentbg:#1B2A46;--danger:#FF8A82;--dangerbg:#3A1618;--ok:#5FD3B8;--okbg:#0F2E27;--warn:#F0BE5B;--warnbg:#35280A;--focus:#FFD166;color-scheme:dark}
:root[data-theme="contrast"]{--bg:#000000;--surface:#000000;--surface2:#0A0A0A;--ink:#FFFFFF;--muted:#E8E8E8;--border:#FFFFFF;--line:#FFFFFF;--accent:#FFD60A;--onaccent:#000000;--accentbg:#1A1A00;--danger:#FF9E9E;--dangerbg:#2A0000;--ok:#7CF2C9;--okbg:#00231A;--warn:#FFD60A;--warnbg:#2A2200;--focus:#00E5FF;color-scheme:dark}
:root[data-size="125"]{--scale:1.25}:root[data-size="150"]{--scale:1.5}
html{font-size:calc(16px * var(--scale));scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-wrap:break-word;background:var(--bg);color:var(--ink);font:400 1rem/1.6 "Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{line-height:1.2;margin:0;letter-spacing:-.01em}h1{font-size:clamp(1.75rem,4vw,2.6rem);font-weight:800}h2{font-size:1.35rem;font-weight:800;margin-top:2.5rem}h3{font-size:1.1rem;font-weight:600}
p{margin:.5rem 0}.muted{color:var(--muted)}.small{font-size:.9rem}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
code,pre,.mono{font-family:"Spline Sans Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85rem}
a{color:var(--accent);text-underline-offset:.2em}:root:not([data-underline="off"]) main a:not(.btn):not(.card-link){text-decoration:underline}
:where(a,button,input,select,textarea,summary,[tabindex]):focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:.25rem}
.skip{position:absolute;left:.5rem;top:-4rem;background:var(--accent);color:var(--onaccent);padding:.75rem 1rem;border-radius:.4rem;z-index:100;font-weight:600}.skip:focus{top:.5rem}
/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:15rem minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:1.25rem 1rem;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:1.25rem}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.15rem;color:var(--ink);text-decoration:none;padding:.25rem}
.rail ul{list-style:none;margin:0;padding:0;display:grid;gap:.25rem}
.rail a.nav{display:flex;align-items:center;gap:.7rem;min-height:2.75rem;padding:.4rem .75rem;border-radius:.5rem;color:var(--ink);text-decoration:none;font-weight:600;border:2px solid transparent}
.rail a.nav:hover{background:var(--surface2)}.rail a.nav[aria-current="page"]{background:var(--accentbg);border-color:var(--accent)}
.rail .note{margin-top:auto;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:.9rem}
.topbar{display:none;flex-wrap:wrap}
main{padding:2.25rem clamp(1rem,4vw,3rem) 6rem;max-width:68rem;width:100%}main:focus{outline:none}
@media (max-width:56rem){.app{grid-template-columns:minmax(0,1fr)}.topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem 1rem;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
 .rail{display:none;position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.rail.open{display:flex}.rail .brand{display:none}}
/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.75rem;padding:.55rem 1.1rem;border-radius:.5rem;border:2px solid var(--border);background:var(--surface);color:var(--ink);font-family:inherit;font-size:1rem;font-weight:600;line-height:1.2;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--surface2)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border-color:var(--danger);color:var(--danger)}.btn[disabled],.btn[aria-disabled="true"]{opacity:1;color:var(--muted);border-style:dashed;cursor:not-allowed;background:transparent}
.row{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}.stack>*+*{margin-top:1rem}
label,.label{display:block;font-weight:600;margin-bottom:.3rem}.hint{color:var(--muted);font-size:.92rem;margin:.15rem 0 .4rem}
input[type=text],input[type=number],select,textarea{width:100%;min-height:2.75rem;padding:.5rem .75rem;border:2px solid var(--border);border-radius:.5rem;background:var(--surface);color:var(--ink);font:inherit}
input[aria-invalid="true"]{border-color:var(--danger);border-width:3px}.err{color:var(--danger);font-weight:600;display:flex;gap:.4rem;margin:.3rem 0}
fieldset{border:0;padding:0;margin:0 0 1.5rem}legend{font-weight:800;font-size:1.1rem;padding:0;margin-bottom:.5rem}
.choice{display:flex;gap:.75rem;align-items:flex-start;padding:.8rem 1rem;border:2px solid var(--border);border-radius:.6rem;background:var(--surface);margin-bottom:.6rem;cursor:pointer}
.choice:has(input:checked){border-color:var(--accent);background:var(--accentbg)}.choice input{width:1.4rem;height:1.4rem;margin-top:.15rem;accent-color:var(--accent);flex:none}.choice,.switch{font-weight:400}.choice b{display:block;font-weight:600}.switch b{font-weight:600}.choice span{color:var(--muted);font-size:.93rem}
.choice:has(input:checked) span{color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:.75rem;padding:1.1rem 1.25rem}
.summary-box{border:3px solid var(--danger);background:var(--dangerbg);border-radius:.6rem;padding:1rem 1.25rem;margin-bottom:1.25rem}.summary-box h2{margin:0 0 .4rem;font-size:1.1rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.15rem .65rem;border-radius:1rem;border:2px solid currentColor;font-weight:600;font-size:.88rem;max-width:100%}
.chip.broken{color:var(--danger);background:var(--dangerbg)}.chip.suspect{color:var(--warn);background:var(--warnbg)}.chip.pass{color:var(--ok);background:var(--okbg)}.chip.wait{color:var(--muted)}
.ic{width:1.1em;height:1.1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.verdict{max-width:22em}.lede{font-size:1.15rem;max-width:40rem}
.stats{display:flex;flex-wrap:wrap;gap:1.5rem 2.5rem;margin:1.25rem 0 0}.stats dt{font-size:.9rem;color:var(--muted)}.stats dd{margin:0;font-size:1.5rem;font-weight:800}
.filters{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0}.filters button{min-height:2.75rem;padding:.4rem 1rem;border-radius:2rem;border:2px solid var(--border);background:var(--surface);color:var(--ink);font-family:inherit;font-size:1rem;font-weight:600;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.findings{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:.75rem}
.finding{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.25rem 1rem;align-items:start;padding:1rem 1.25rem;background:var(--surface);border:1px solid var(--border);border-left:8px solid var(--danger);border-radius:.6rem}
.finding.suspect{border-left-color:var(--warn)}.finding.dismissed{border-left-color:var(--border);opacity:1}.finding h3{margin:0}.finding a.card-link{color:var(--ink);text-decoration:underline;text-underline-offset:.2em}
.finding .meta{grid-column:2;color:var(--muted);font-size:.93rem}
.mapwrap{overflow-x:auto;border:1px solid var(--border);border-radius:.6rem;background:var(--surface);padding:.5rem}
.map .edge{fill:none;stroke:var(--border);stroke-width:1.6}.map .dot{fill:var(--accent)}.map .bad .dot{fill:var(--danger)}.map .ring{fill:none;stroke:var(--danger);stroke-width:2.5}
.map text{fill:var(--ink);font:500 10.5px "Spline Sans Mono",monospace}.map .t2{fill:var(--muted);font:400 11px "Hanken Grotesk",sans-serif}.map a:focus-visible{outline:none}.map a:focus-visible .focusring{stroke:var(--focus);stroke-width:4}.map .focusring{fill:none;stroke:transparent}
table{border-collapse:collapse;width:100%;background:var(--surface)}caption{text-align:left;font-weight:800;padding:.5rem 0}th,td{text-align:left;padding:.7rem .9rem;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:.9rem;color:var(--muted);border-bottom:2px solid var(--border)}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:.6rem}
pre{margin:.5rem 0 0;padding:1rem;border:1px solid var(--border);border-radius:.5rem;background:var(--surface2);overflow:auto;max-height:20rem;white-space:pre}
ol.steps{padding-left:1.4rem;margin:.4rem 0}ol.steps li{padding:.15rem 0}
.crumbs{font-size:.95rem;margin-bottom:1rem}.crumbs ol{list-style:none;display:flex;gap:.5rem;padding:0;margin:0;flex-wrap:wrap}.crumbs li+li::before{content:"/";margin-right:.5rem;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:1.5rem 2.5rem;margin-top:1.25rem}@media (max-width:56rem){.cols{grid-template-columns:1fr}}
.shot{border:2px solid var(--border);border-radius:.5rem;background:#fff;color:#111;overflow:hidden;max-width:34rem}.shot .nav{background:#eef1f4;padding:.4rem .75rem;font-size:.75rem;color:#1b3a8a;border-bottom:1px solid #c8d0d8}.shot .pg{padding:.9rem 1rem;min-height:7rem}.shot .h{font-size:1.1rem;font-weight:800;color:#111;margin:0 0 .3rem}.shot .console{background:#2b0f12;color:#ffb3b3;font:.72rem "Spline Sans Mono",monospace;padding:.5rem .75rem}
.player{border:2px solid var(--border);border-radius:.6rem;overflow:hidden;background:var(--surface);max-width:34rem}.player .screen{aspect-ratio:16/9;background:#0E1620;color:#fff;display:grid;place-items:center;text-align:center;padding:1rem;position:relative}
.player .cap{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);background:rgba(12,18,26,.92);color:#fff;padding:.4rem .8rem;border-radius:.4rem;max-width:90%;font-size:.95rem}.player .ctl{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.6rem}
.player input[type=range]{flex:1;min-width:6rem;accent-color:var(--accent);height:2rem}
.switch{display:flex;gap:.75rem;align-items:center;min-height:2.75rem;cursor:pointer}
.switch input[type=checkbox]{appearance:none;-webkit-appearance:none;width:3.1rem;height:1.8rem;flex:none;margin:0;border:2px solid var(--border);border-radius:1rem;background:var(--surface2);position:relative;cursor:pointer}
.switch input[type=checkbox]::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.1rem;height:1.1rem;border-radius:50%;background:var(--ink);transition:transform .15s}
.switch input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}.switch input[type=checkbox]:checked::after{transform:translateX(1.3rem);background:var(--onaccent)}
.switch input[type=checkbox]:disabled{cursor:not-allowed;border-style:dashed}.switch .state{margin-left:.4rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;list-style:none;padding:0;margin:.5rem 0}.chips li{display:inline-flex;align-items:center;gap:.4rem;border:2px solid var(--border);border-radius:.4rem;padding:.2rem .3rem .2rem .7rem;background:var(--surface)}.chips button{min-height:2.75rem;min-width:2.75rem;border:0;background:transparent;color:var(--ink);cursor:pointer;font-size:1.1rem;border-radius:.3rem}
progress{width:100%;height:1.1rem;accent-color:var(--accent)}
.runsteps{list-style:none;padding:0;margin:1rem 0;display:grid;gap:.5rem}.runsteps li{display:flex;gap:.75rem;align-items:center;padding:.7rem 1rem;border:1px solid var(--border);border-radius:.6rem;background:var(--surface)}.runsteps li[aria-current="step"]{border:3px solid var(--accent)}
details{border:1px solid var(--border);border-radius:.6rem;background:var(--surface);padding:.2rem 1rem;margin:.75rem 0}summary{cursor:pointer;font-weight:600;min-height:2.75rem;display:flex;align-items:center}
dialog{border:3px solid var(--accent);border-radius:.8rem;background:var(--surface);color:var(--ink);max-width:min(32rem,calc(100vw - 2rem));padding:1.5rem}dialog::backdrop{background:rgba(0,0,0,.6)}
.audit td.num{font-variant-numeric:tabular-nums;text-align:right}
/* mobile overrides must come AFTER the base rules they override */
@media (max-width:56rem){.finding{grid-template-columns:minmax(0,1fr)}.finding .meta{grid-column:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
:root[data-motion="reduce"] *{animation:none!important;transition:none!important}
@media (forced-colors:active){.btn,.chip,.choice,input,select,.card,.finding{border:2px solid ButtonText}.btn.primary{background:Highlight;color:HighlightText}:focus-visible{outline-color:Highlight}}
</style>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('fr:'+k);return v===null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('fr:'+k,JSON.stringify(v))}catch{}}};
const ic=(n,extra='')=>`<svg class="ic" aria-hidden="true" ${extra}><use href="#i-${n}"/></svg>`;
const plural=(n,a,b)=>`${n} ${n===1?a:(b||a+'s')}`;
let live;const say=m=>{const l=$('#live');l.textContent='';clearTimeout(live);live=setTimeout(()=>{l.textContent=m},60)};

/* ---------- settings ---------- */
const S={theme:store.get('theme','system'),size:store.get('size',100),motion:store.get('motion','system'),underline:store.get('underline',true)};
function applySettings(){const r=document.documentElement;r.dataset.theme=S.theme;r.dataset.size=String(S.size);if(S.motion==='reduce')r.dataset.motion='reduce';else delete r.dataset.motion;r.dataset.underline=S.underline?'on':'off';
  for(const k of Object.keys(S))store.set(k,S[k])}
applySettings();

/* ---------- sample data (the Shopfront check shown in the sample report) ---------- */
const PAGES=[
 {id:'s0',r:'/',t:'Welcome to Shopfront',d:0,x:0},{id:'s1',r:'/products',t:'All products',d:1,x:0,p:'s0'},{id:'s2',r:'/cart',t:'Your cart',d:1,x:1,p:'s0'},{id:'s3',r:'/about',t:'About us',d:1,x:2,p:'s0'},
 {id:'s4',r:'/contact',t:'Contact us',d:1,x:3,p:'s0'},{id:'s5',r:'/login',t:'Log in',d:1,x:4,p:'s0'},{id:'s6',r:'/products/1',t:'Studio Headphones',d:1,x:5,p:'s0'},{id:'s7',r:'/help-center',t:'Page not found',d:1,x:6,p:'s0'},
 {id:'s8',r:'/products?category=audio',t:'Category: audio',d:2,x:0,p:'s1'},{id:'s9',r:'/contact/sent',t:'Message sent',d:2,x:3,p:'s4'},{id:'s10',r:'/account',t:'My account',d:2,x:4,p:'s5'},{id:'s11',r:'/login',t:'Log in (wrong password)',d:2,x:5,p:'s5'}];
const FINDINGS=[
 {id:'F1',kind:'Console error',sev:'broken',route:'/about',page:'s3',title:'Console error on /about',what:'The About page logs an error as it loads: “Team widget failed to initialise”. Visitors see nothing wrong, but something on the page is not working.',steps:['Open “About”'],replays:'2 of 2',assert:'no console errors'},
 {id:'F2',kind:'Broken link',sev:'broken',route:'/help-center',page:'s7',title:'The Help link leads to a 404 page',what:'The “Help” link in the footer goes to /help-center, which does not exist. Visitors who need help land on “Page not found”.',steps:['Open “Help”'],replays:'2 of 2',assert:'link should not lead to a 404'},
 {id:'F3',kind:'Page scrolls sideways',sev:'broken',route:'/products',page:'s1',title:'The Products page scrolls sideways',what:'Something on the page is 1,700 px wide in a 1,280 px window, so people have to scroll horizontally to see it.',steps:['Open “Products”'],replays:'2 of 2',assert:'page should not scroll horizontally'},

function routeMap(){const GX=172,GY=105,PX=96,PY=40,pos={};PAGES.forEach(p=>pos[p.id]={x:PX+p.x*GX,y:PY+p.d*GY});const W=PX*2+6*GX,H=PY*2+2*GY+30;
 const edges=PAGES.filter(p=>p.p).map(p=>{const a=pos[p.p],b=pos[p.id],m=(a.y+b.y)/2;return `<path class="edge" d="M${a.x},${a.y+10} C${a.x},${m} ${b.x},${m} ${b.x},${b.y-10}"/>`}).join('');
 const nodes=PAGES.map(p=>{const q=pos[p.id],fs=FINDINGS.filter(f=>f.page===p.id&&!dismissed[f.id]),bad=fs.length>0;const lab=p.r;   // never truncated: a link's accessible name must contain its visible text
  const inner=`<g class="${bad?'bad':''}" transform="translate(${q.x},${q.y})">${bad?'<circle class="ring" r="16"/>':''}<circle class="focusring" r="20"/><circle class="dot" r="8"/><text y="30" text-anchor="middle">${esc(lab)}</text>

function pageTable(){return `<div class="tablewrap"><table><caption class="sr">Pages Flowright reached</caption><thead><tr><th scope="col">Page</th><th scope="col">Reached from</th><th scope="col">Problems</th></tr></thead><tbody>${PAGES.map(p=>{const fs=FINDINGS.filter(f=>f.page===p.id&&!dismissed[f.id]);const par=PAGES.find(x=>x.id===p.p);return `<tr><td><span class="mono">${esc(p.r)}</span><br><span class="muted small">${esc(p.t)}</span></td><td>${par?esc(par.r):'Start page'}</td><td>${fs.length?fs.map(f=>`<a href="#finding-${f.id}">${esc(f.kind)}</a>`).join('<br>'):'<span class="chip pass">'+ic('check')+'None</span>'}</td></tr>`}).join('')}</tbody></table></div>`}

function contrastRows(){const cs=getComputedStyle(document.documentElement);const g=n=>cs.getPropertyValue('--'+n).trim();
 const P=[['Body text on page','ink','bg',4.5],['Body text on cards','ink','surface',4.5],['Secondary text on cards','muted','surface',4.5],['Secondary text on page','muted','bg',4.5],['Links on cards','accent','surface',4.5],['Button text on blue button','onaccent','accent',4.5],['Broken label on its tint','danger','dangerbg',4.5],['Suspected label on its tint','warn','warnbg',4.5],['Passed label on its tint','ok','okbg',4.5],['Control borders on cards','border','surface',3],['Control borders on page','border','bg',3],['Focus outline on cards','focus','surface',3],['Focus outline on page','focus','bg',3]];
 const L=h=>{h=h.replace('#','');const c=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2]};
 return P.map(([n,a,b,need])=>{const A=g(a),B=g(b);if(!/^#[0-9a-f]{6}$/i.test(A)||!/^#[0-9a-f]{6}$/i.test(B))return null;const la=L(A),lb=L(B),r=(Math.max(la,lb)+.05)/(Math.min(la,lb)+.05);return {n,a:A,b:B,r,need,ok:r>=need,aaa:need===4.5&&r>=7}}).filter(Boolean)}
function viewSettings(){return `
<h1>Settings</h1><p class="lede">Changes apply immediately and are remembered on this device.</p>
<h2>Appearance and accessibility</h2>
<form class="stack" style="max-width:44rem" onsubmit="return false">
 <fieldset><legend>Colors</legend>${[['system','Match my device','Follows your light or dark setting.'],['light','Light',''],['dark','Dark',''],['contrast','High contrast','Black and white with yellow accents. Every text pair is above 10:1.']].map(([v,l,d])=>`<label class="choice"><input type="radio" name="theme" value="${v}" ${S.theme===v?'checked':''}><span><b>${l}</b>${d}</span></label>`).join('')}</fieldset>
 <fieldset><legend>Text size</legend><div class="row">${[100,125,150].map(v=>`<label class="choice" style="margin:0"><input type="radio" name="size" value="${v}" ${S.size===v?'checked':''}><span><b>${v}%</b></span></label>`).join('')}</div><p class="hint">The layout reflows instead of scrolling sideways, down to a 320 px wide screen.</p></fieldset>
 <fieldset><legend>Motion and links</legend><label class="switch"><input type="checkbox" role="switch" id="s-motion" ${S.motion==='reduce'?'checked':''}><span><b>Reduce motion</b> <span class="muted" id="s-motion-s">${S.motion==='reduce'?'On':'Follows device'}</span></span></label>
 <label class="switch"><input type="checkbox" role="switch" id="s-ul" ${S.underline?'checked':''}><span><b>Underline links</b> <span class="muted" id="s-ul-s">${S.underline?'On':'Off'}</span></span></label></fieldset></form>
<h3 style="margin-top:1.5rem">Contrast in the current theme</h3><p class="muted">Calculated live from this page’s own colors, using the WCAG formula. Text needs 4.5 to 1 (AA) or 7 to 1 (AAA); borders and focus outlines need 3 to 1.</p>
<div class="tablewrap audit"><table><caption class="sr">Color contrast ratios</caption><thead><tr><th scope="col">Pair</th><th scope="col">Ratio</th><th scope="col">Needs</th><th scope="col">Result</th></tr></thead><tbody id="audit">${auditRows()}</tbody></table></div>
<h2>Safety</h2><div class="card stack" style="max-width:44rem"><div><span class="label" id="bl">Never click anything that matches</span><p class="hint">Applies on every run, even in a sandbox.</p>
 <ul class="chips" aria-labelledby="bl" id="blocks">${['log ?out','sign ?out'].map(b=>`<li><span class="mono">${b}</span><button aria-label="Remove ${b}" data-act="rmblock" data-b="${b}">×</button></li>`).join('')}</ul>
 <div class="row"><div style="flex:1 1 10rem;min-width:0"><label for="newblock" class="sr">Add a pattern</label><input id="newblock" type="text" placeholder="e.g. unsubscribe"></div><button class="btn" data-act="addblock">Add pattern</button></div></div></div>
<h2>Language model</h2><div class="card stack" style="max-width:44rem"><label class="switch"><input type="checkbox" role="switch" disabled><span><b>Use a language model</b> <span class="muted">Off</span></span></label>
 <p class="hint" style="margin:0">Optional, and nothing needs it. Needs an API key, and it can only suggest: names, narration wording, which button to try. It never decides whether something passed. Every call is logged and capped.</p></div>`}
const auditRows=()=>contrastRows().map(r=>`<tr><th scope="row" style="color:var(--ink);font-size:1rem">${r.n}</th><td class="num">${r.r.toFixed(2)} to 1</td><td>${r.need} to 1</td><td><span class="chip ${r.ok?'pass':'broken'}">${ic(r.ok?'check':'x')}${r.ok?(r.aaa?'Passes AAA':'Passes'):'Fails'}</span></td></tr>`).join('');

/* ---------- router ---------- */
const ROUTES=[[/^#new$/,'New check',viewNew,'new'],[/^#running$/,'Check in progress',viewRunning,'results'],[/^#results$/,'Results',viewResults,'results'],[/^#finding-(\w+)$/,'Problem',m=>viewFinding(m[1]),'results'],[/^#flows$/,'Flows',()=>viewFlows(),'flows'],[/^#flow-(\w+)$/,'Flow',m=>viewFlow(m[1]),'flows'],[/^#demos(-[\w-]+)?$/,'Record a demo',viewDemos,'demos'],[/^#prefs$/,'Settings',viewSettings,'settings']];
function render(){clearInterval(timer);const h=location.hash||'#new';let hit=ROUTES.find(r=>r[0].test(h));const main=$('#main');let m=hit&&h.match(hit[0]);
 if(!hit){main.innerHTML=`<h1>Page not found</h1><p><a href="#new">Go to New check</a></p>`;document.title='Page not found - Flowright';}else{main.innerHTML=hit[2](m);const h1=$('h1',main);document.title=`${h1?h1.textContent:hit[1]} - Flowright`;$$('[data-nav]').forEach(a=>a.dataset.nav===hit[3]?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));}
 if(navigated){const h1=$('h1',main);if(h1){h1.setAttribute('tabindex','-1');h1.focus({preventScroll:false});}say(document.title.replace(' - Flowright',''));window.scrollTo(0,0)}
 $('#rail').classList.remove('open');$('#menubtn').setAttribute('aria-expanded','false');if(hit&&hit[3]!=='x'&&h.startsWith('#running'))startRun();}
// the skip link's #main is an in-page anchor, not a route: ignore it instead of rendering "Page not found"
window.addEventListener('hashchange',()=>{if(location.hash==='#main')return;navigated=true;render()});
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();const m=document.getElementById('main');m.focus();m.scrollIntoView()});

/* ---------- simulated run ---------- */
function startRun(){if(!run)return;const T=[0,10,18,26,32,36];let tick=run.tick||0;const upd=()=>{const step=Math.min(4,T.findIndex((t,i)=>tick<T[i+1]));const done=tick>=T[5];const pct=Math.min(100,Math.round(tick/T[5]*100));
  if(!$('#run-status'))return;$('#run-prog').value=pct;$('#run-pct').textContent=`${pct}% complete`;
  $$('#run-steps li').forEach((li,i)=>{const s=done||i<step?'done':i===step?'now':'wait';li.querySelector('.st').innerHTML=s==='done'?`<span class="chip pass">${ic('check')}Done</span>`:s==='now'?`<span class="chip" style="color:var(--accent);background:var(--accentbg)">${ic('clock')}In progress</span>`:`<span class="chip wait">${ic('dots')}Waiting</span>`;if(s==='now')li.setAttribute('aria-current','step');else li.removeAttribute('aria-current')});
  const pages=Math.min(12,Math.floor(tick/2.8)+1),clicks=Math.min(42,tick*2+1),prob=tick<12?0:Math.min(6,Math.floor((tick-10)/2.6));
  $('#st-pages').textContent=pages;$('#st-clicks').textContent=clicks;$('#st-prob').textContent=done?6:prob;
  const msg=done?'Check complete. 6 problems found.':`Step ${step+1} of 5: ${STEPS[step][0]}.`;if($('#run-status').textContent!==msg){$('#run-status').textContent=msg;say(msg)}
  if(!logPaused&&!done&&tick%2===0){const l=$('#log');l.textContent+=`${String(tick).padStart(2,'0')}s  ${STEPS[step][0].toLowerCase()}: page ${pages}, ${clicks} clicks\n`;l.scrollTop=l.scrollHeight}
  if(done){clearInterval(timer);$('#run-lede').textContent='All done. Every problem was replayed to make sure it is real.';$('#run-actions').innerHTML=`<a class="btn primary" href="#results">See the results</a>`}};
 upd();timer=setInterval(()=>{tick++;run.tick=tick;upd()},S.motion==='reduce'?700:900)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('[data-act],[data-filter],[data-view],#menubtn,#pause');if(!t)return;
 if(t.id==='menubtn'){const o=$('#rail').classList.toggle('open');t.setAttribute('aria-expanded',o);return}
 if(t.id==='pause'){logPaused=!logPaused;t.setAttribute('aria-pressed',logPaused);t.textContent=logPaused?'Resume live updates':'Pause live updates';return}
 if(t.dataset.filter){filter=t.dataset.filter;const y=scrollY;render();scrollTo(0,y);const b=$(`[data-filter="${filter}"]`);if(b)b.focus();return}
 if(t.dataset.view){mapView=t.dataset.view;const y=scrollY;render();scrollTo(0,y);const b=$(`[data-view="${mapView}"]`);if(b)b.focus();return}
 const a=t.dataset.act,id=t.dataset.id,st=$('#act-s');
 if(a==='dismiss')return openDlg(`<h2 id="dlg-title" style="margin-top:0">Mark ${id} as not a bug?</h2><form method="dialog" class="stack"><fieldset><legend class="sr">Reason</legend>${['This is intended behavior','It only happens in my test data','I’ll fix it later'].map((r,i)=>`<label class="choice"><input type="radio" name="why" value="${r}" ${i===0?'checked':''}><span><b>${r}</b></span></label>`).join('')}</fieldset><p class="hint">It moves out of your count and stays listed under “Marked not a bug”. You can restore it any time.</p><div class="row"><button class="btn primary" value="ok">Mark as not a bug</button><button class="btn" value="cancel">Keep it</button></div></form>`,r=>{if(r==='ok'){dismissed[id]=true;store.set('dismissed',dismissed);location.hash='#results';setTimeout(()=>say(`${id} marked as not a bug. ${counts().open.length} problems remain.`),300)}},t);
 if(a==='restore'){delete dismissed[id];store.set('dismissed',dismissed);render();say(`${id} restored.`)}
 if(a==='rerun'||a==='replay'){t.disabled=true;st.textContent='Replaying from a fresh browser…';say('Replaying');setTimeout(()=>{t.disabled=false;st.textContent=a==='rerun'?'It happened again. Confirmed.':'Passed: it arrived at the same page.';say(st.textContent)},1400)}
 if(a==='copy'){const f=FINDINGS.find(x=>x.id===id);const done=ok=>{$('#copy-s').textContent=ok?'Copied to your clipboard.':'Couldn’t copy automatically. Select the code below and copy it.';say($('#copy-s').textContent)};try{navigator.clipboard.writeText(reproFor(f)).then(()=>done(true),()=>done(false))}catch{done(false)}}
 if(a==='download'){$('#dl-s').textContent='In the real app this saves report.html with videos and traces.'}
 if(a==='cancel')return openDlg(`<h2 id="dlg-title" style="margin-top:0">Stop this check?</h2><p>Progress so far won’t be saved.</p><form method="dialog" class="row"><button class="btn danger" value="stop">Stop check</button><button class="btn primary" value="keep">Keep running</button></form>`,r=>{if(r==='stop'){run=null;location.hash='#new'}},t);
 if(a==='play'){const p=t.closest('[data-player]');const on=t.dataset.on!=='1';t.dataset.on=on?'1':'0';t.innerHTML=ic(on?'dots':'play')+(on?'Pause':'Play');t.setAttribute('aria-label',on?'Pause video':'Play video');clearInterval(p._t);if(on){const sk=$('[data-seek]',p);p._t=setInterval(()=>{let v=+sk.value+(S.motion==='reduce'?4:2);if(v>=100){v=100;clearInterval(p._t);t.dataset.on='0';t.innerHTML=ic('play')+'Play'}sk.value=v;sk.dispatchEvent(new Event('input'))},160)}}
 if(a==='cc'){const on=t.getAttribute('aria-pressed')!=='true';t.setAttribute('aria-pressed',on);t.textContent=on?'Captions on':'Captions off';$('[data-cap]',t.closest('[data-player]')).hidden=!on}
 if(a==='rmblock'){t.closest('li').remove();say('Pattern removed')}
 if(a==='addblock'){const i=$('#newblock'),v=i.value.trim();if(v){const li=document.createElement('li');li.innerHTML=`<span class="mono"></span><button aria-label="" data-act="rmblock">×</button>`;li.firstChild.textContent=v;li.lastChild.setAttribute('aria-label','Remove '+v);$('#blocks').appendChild(li);i.value='';say('Pattern added')}i.focus()}});
function openDlg(html,done,opener){const d=$('#dlg');d.innerHTML=html;d.showModal();d.addEventListener('close',function h(){d.removeEventListener('close',h);done(d.returnValue);opener&&document.contains(opener)&&opener.focus()});}
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='fq'){$('#flowtable').innerHTML=flowTable(FLOWS.filter(f=>f.name.toLowerCase().includes(t.value.toLowerCase())));const n=FLOWS.filter(f=>f.name.toLowerCase().includes(t.value.toLowerCase())).length;$('#fq-s').textContent=plural(n,'flow')+' shown.'}
 if(t.matches('[data-seek]')){const p=t.closest('[data-player]'),s=Math.round(t.value/100*8);$('[data-time]',p).textContent=`0:0${s} / 0:08`;$('[data-cap]',p).textContent=CAPS[Math.min(3,Math.floor(t.value/25))]}
 if(t.matches('[data-line]')){const lines=$$('[data-line]');lines.forEach((x,i)=>{$('#ln'+i+'-d').textContent=secs(x.value).toFixed(1)+' s'});$('#tot').textContent='Total length: about '+lines.reduce((a,x)=>a+secs(x.value),0).toFixed(0)+' seconds.'}
 if(t.id==='url'){draft.url=t.value;const own=$('#own');if(own)own.hidden=isLocal(t.value)}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.name==='scope'){draft.scope=t.value;$('#f-diff').hidden=t.value!=='diff';$('#f-goal').hidden=t.value!=='goal'}
 if(t.id==='sandbox'){draft.sandbox=t.checked;$('#sandbox-s').textContent=t.checked?'On':'Off';say('Allow deleting and placing orders: '+(t.checked?'on':'off'))}
 if(t.id==='owncb')draft.own=t.checked;
 if(t.name==='theme'){S.theme=t.value;applySettings();$('#audit').innerHTML=auditRows();say('Theme: '+t.closest('label').textContent.trim().split('\n')[0])}
 if(t.name==='size'){S.size=+t.value;applySettings();say('Text size '+t.value+' percent')}
 if(t.id==='s-motion'){S.motion=t.checked?'reduce':'system';applySettings();$('#s-motion-s').textContent=t.checked?'On':'Follows device'}
 if(t.id==='s-ul'){S.underline=t.checked;applySettings();$('#s-ul-s').textContent=t.checked?'On':'Off'}
 if(t.id==='dflow')location.hash='#demos-'+t.value});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
 if(f.id==='newform'){const v=n=>f.elements[n].value.trim();draft.url=v('url');draft.base=v('base');draft.goal=v('goal');draft.success=v('success');const errs=[];
  $$('.err',f).forEach(x=>x.remove());$$('[aria-invalid]',f).forEach(x=>x.removeAttribute('aria-invalid'));
  const bad=(id,msg)=>{errs.push([id,msg]);const el=$('#'+id);el.setAttribute('aria-invalid','true');$('#'+id+'-e').innerHTML=`<p class="err" id="${id}-m">${ic('x')}<span>${esc(msg)}</span></p>`};
  if(!draft.url)bad('url','Enter the address of your app, like http://localhost:3000.');else if(!/^[\w.-]+(:\d+)?(\/.*)?$|^https?:\/\//.test(draft.url))bad('url','That doesn’t look like an address. Try http://localhost:3000.');
  else if(!isLocal(draft.url)&&!draft.own)bad('url',`“${draft.url.replace(/^https?:\/\//,'')}” isn’t on your computer. Confirm below that you own it and it’s safe to click through, or use a local address.`);
  if(draft.scope==='diff'&&!draft.base)bad('base','Enter the branch to compare against, like main.');
  if(draft.scope==='goal'){if(!draft.goal)bad('goal','Describe what a user should be able to do.');if(!draft.success)bad('success','Enter text that must appear when the goal is reached.')}
  const box=$('#errsum');
  if(errs.length){box.innerHTML=`<div class="summary-box" role="alert"><h2>${plural(errs.length,'thing')} to fix before we start</h2><ul>${errs.map(([id,m])=>`<li><a href="#" data-jump="${id}">${esc(m)}</a></li>`).join('')}</ul></div>`;box.focus();return}
  store.set('draft',draft);run={tick:0};location.hash='#running';return}
 if(f.id==='demoform'){const out=$('#demo-out'),btn=$('button[type=submit]',f);btn.disabled=true;out.innerHTML=`<p>Recording… <progress max="100" value="30" aria-label="Recording progress"></progress></p>`;say('Recording the demo');setTimeout(()=>{btn.disabled=false;const n=$$('[data-line]').length;out.innerHTML=`<div class="card"><p class="chip pass" style="margin:0">${ic('check')}Demo ready</p><p>${n} captions, about ${$('#tot').textContent.replace('Total length: about ','')}.</p><div class="row"><a class="btn" href="#demos" data-fake>demo.mp4</a><a class="btn" href="#demos" data-fake>captions.vtt</a><a class="btn" href="#demos" data-fake>script.md</a></div><p class="small muted">In the real app these download. Here they’re placeholders.</p></div>`;say('Demo ready')},1500)}});
document.addEventListener('click',e=>{const j=e.target.closest('[data-jump]');if(j){e.preventDefault();const el=$('#'+j.dataset.jump);el.focus();el.scrollIntoView({block:'center'})}const fk=e.target.closest('[data-fake]');if(fk)e.preventDefault()});
render();
</script>
