.field input[type=search]{width:100%}.tl{display:flex;gap:.4rem;overflow-x:auto;padding:.6rem .2rem;list-style:none;margin:0}.tl li{flex:none}.seg-btn{min-height:3.25rem;min-width:7rem;padding:.4rem .9rem;border:2px solid var(--ink);border-radius:.8rem;background:var(--surface);color:var(--ink);font:inherit;font-weight:800;cursor:pointer;text-align:left}.seg-btn[aria-pressed="true"]{background:var(--blue);color:var(--onblue)}.seg-btn small{display:block;font-weight:600;opacity:.95}

.tablewrap{overflow-x:auto;border:2px solid var(--ink);border-radius:.9rem}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:.6rem .8rem;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:.85rem}td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;list-style:none;padding:0;margin:.5rem 0}.chips li{display:inline-flex;align-items:center;gap:.3rem;border:2px solid var(--ink);border-radius:.6rem;padding:.1rem .2rem .1rem .7rem;background:var(--surface)}.chips button{min-height:2.75rem;min-width:2.75rem;border:0;background:transparent;color:var(--ink);cursor:pointer;font-size:1.2rem;border-radius:.4rem}
dialog{border:3px solid var(--ink);border-radius:1.1rem;background:var(--surface);color:var(--ink);max-width:min(30rem,calc(100vw - 2rem));padding:1.4rem;box-shadow:0 8px 0 var(--shadow)}dialog::backdrop{background:rgba(0,0,0,.6)}
.choice{display:flex;gap:.7rem;align-items:center;padding:.7rem .9rem;border:2px solid var(--ink);border-radius:.8rem;background:var(--surface);margin-bottom:.5rem;cursor:pointer;font-weight:600}.choice input{width:1.4rem;height:1.4rem;accent-color:var(--blue)}.choice:has(input:checked){background:var(--bluebg);border-color:var(--blue)}
.crumbs{margin-bottom:.8rem}.crumbs ol{list-style:none;display:flex;gap:.5rem;padding:0;margin:0;flex-wrap:wrap}.crumbs li+li::before{content:"/";margin-right:.5rem;color:var(--muted)}

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('fr2:'+k);return v===null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('fr2:'+k,JSON.stringify(v))}catch{}}};
const ic=(n,x='')=>`<svg class="ic" aria-hidden="true" ${x}><use href="#i-${n}"/></svg>`;const plural=(n,a,b)=>`${n} ${n===1?a:(b||a+'s')}`;
let liveT;const say=m=>{const l=$('#live');l.textContent='';clearTimeout(liveT);liveT=setTimeout(()=>{l.textContent=m},60)};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* ---------- settings ---------- */
const S={theme:store.get('theme','system'),size:store.get('size',100),motion:store.get('motion','system'),underline:store.get('underline',true)};
const THEMES=[['system','Auto'],['light','Light'],['dark','Dark'],['contrast','High contrast']];
function applySettings(){const r=document.documentElement;r.dataset.theme=S.theme;r.dataset.size=String(S.size);if(S.motion==='reduce')r.dataset.motion='reduce';else delete r.dataset.motion;r.dataset.underline=S.underline?'on':'off';Object.keys(S).forEach(k=>store.set(k,S[k]));
 const t=THEMES.find(x=>x[0]===S.theme);const b=$('#themebtn');if(b){$('#themelbl').textContent=t[1]==='High contrast'?'Contrast':t[1];b.setAttribute('aria-label',`Color theme: ${t[1]}. Press to change`)}}
const reduced=()=>S.motion==='reduce'||matchMedia('(prefers-reduced-motion: reduce)').matches;
/* ---------- the sample app and what can break in it ---------- */
const PAGES={home:{n:'Home',x:70,y:150,line:'blue'},products:{n:'Products',x:230,y:70,line:'blue'},cart:{n:'Cart',x:390,y:70,line:'blue'},about:{n:'About',x:230,y:150,line:'green'},contact:{n:'Contact',x:390,y:150,line:'green'},help:{n:'Help',x:230,y:230,line:'amber'}};
const EDGES=[['home','products'],['products','cart'],['home','about'],['about','contact'],['home','help']];const ORDER=['home','products','cart','about','contact','help'];
const BUGS={help:{id:'F1',page:'help',icon:'link',kind:'Broken link',title:'Help leads to a 404',tog:'Help link',path:['home','help'],steps:['Open Home','Press “Help”']},
 dead:{id:'F2',page:'products',icon:'cursor',kind:'Dead button',title:'“Add” does nothing',tog:'Add button',path:['home','products'],steps:['Open Home','Press “Products”','Press “Add”']},
 wide:{id:'F3',page:'products',icon:'all',kind:'Sideways scroll',title:'Products scrolls sideways',tog:'Page width',path:['home','products'],steps:['Open Home','Press “Products”']},
 about:{id:'F4',page:'about',icon:'bug',kind:'Console error',title:'Console error on About',tog:'About page',path:['home','about'],steps:['Open Home','Press “About”']}};
BUGS.alt={id:'F5',page:'about',icon:'eye',kind:'Accessibility',title:'Image has no text description',tog:'Image text',path:['home','about'],steps:['Open Home','Press “About”']};
BUGS.look={id:'F6',page:'home',icon:'all',kind:'Visual change',title:'Home looks different from last time',tog:'Look and feel',path:['home'],steps:['Open Home']};
Object.entries({help:'link',dead:'dead',wide:'wide',about:'console',alt:'alt',look:'look'}).forEach(([k,t])=>{BUGS[k].type=t});
let bugs=store.get('bugs',{help:true,dead:true,wide:true,about:false,alt:false,look:false});const dismissed=store.get('dismissed',{});
const CTYPES={link:['link','Broken link','Link on {p} leads nowhere','Link'],dead:['cursor','Dead button','Button on {p} does nothing','Button'],console:['bug','Console error','Console error on {p}','Console'],wide:['all','Sideways scroll','{p} scrolls sideways','Width'],alt:['eye','Accessibility','Image on {p} has no text description','Image text'],look:['all','Visual change','{p} looks different from last time','Look']};
const custom=store.get('custom',[]);
function mkBug(key,page,type,n){const T=CTYPES[type],pn=PAGES[page].n;BUGS[key]={id:'F'+n,page,type,icon:T[0],kind:T[1],title:T[2].replace('{p}',pn),tog:`${T[3]} on ${pn}`,path:['home',page],steps:['Open Home',...(page==='home'?[]:[`Press “${pn}”`])]}}
custom.forEach(c=>mkBug(c.key,c.page,c.type,c.n));
function addCustom(page,type){const n=Object.keys(BUGS).length+1,key='c'+n;mkBug(key,page,type,n);bugs[key]=true;custom.push({key,page,type,n});store.set('custom',custom);store.set('bugs',bugs);return key}
let prevRun=store.get('prevRun',null),curRun=store.get('curRun',null);
const commitRun=()=>{prevRun=curRun;curRun=active();store.set('prevRun',prevRun);store.set('curRun',curRun)};
const statusOf=k=>dismissed[k]?'accepted':(!prevRun?'new':prevRun.includes(k)?'open':'new');
const STATUS={new:['bad','New'],open:['info','Still open'],accepted:['warn','Accepted']};
const active=()=>Object.keys(BUGS).filter(k=>bugs[k]).sort((a,b)=>BUGS[a].id.localeCompare(BUGS[b].id));
const byId=id=>Object.keys(BUGS).find(k=>BUGS[k].id===id);
const reproFor=k=>{const b=BUGS[k];const a={link:"expect(badResponses.filter(r => r.startsWith('404')), 'link should not 404').toEqual([]);",dead:"expect(await cartCount(page), 'Add should change the cart').toBe(1);",wide:"expect(await page.evaluate(() => document.documentElement.scrollWidth <= innerWidth + 1)).toBe(true);",console:"expect(consoleErrors, 'no console errors').toEqual([]);",alt:"expect(axe.violations.filter(v => v.id === 'image-alt')).toEqual([]);",look:"await expect(page).toHaveScreenshot('home.png', { maxDiffPixelRatio: 0.002 });"}[BUGS[k].type];
 return `test("${b.title}", async ({ page }) => {\n  await page.goto(BASE + "/");\n${b.steps.slice(1).map(s=>`  // ${s}`).join('\n')}\n  ${a}\n});`};
/* ---------- route map (the brand): stations are pages, lines are how they connect ---------- */
function mapSVG(o={}){const bad=o.bad||new Set(),ok=o.ok||new Set(),hl=o.hl||new Set(),links=o.links||{},st=o.static?' static':'';
 const e=EDGES.map(([a,b])=>{const A=PAGES[a],B=PAGES[b],dx=(B.x-A.x)/2;return `<path class="ed ${PAGES[b].line}" data-e="${a}-${b}" pathLength="1" d="M${A.x},${A.y} C${A.x+dx},${A.y} ${B.x-dx},${B.y} ${B.x},${B.y}"/>`}).join('');
 const n=ORDER.map(id=>{const p=PAGES[id],isBad=bad.has(id);const g=`<g class="st${isBad?' bad':''}${ok.has(id)?' ok':''}${hl.has(id)?' hl':''}${o.static?' on':''}" data-p="${id}" transform="translate(${p.x},${p.y})"><circle class="focusring" r="22"/><circle class="halo" r="19"/><circle class="ring" r="12"/><path class="tick" d="M-5 .5l3.5 3.6L6 -3.6"/><g class="badge" transform="translate(14,-14)"><circle r="9"/><path d="M-3.4 -3.4l6.8 6.8M3.4 -3.4l-6.8 6.8"/></g><text y="36">${p.n}</text></g>`;
  return links[id]?`<a href="${links[id].href}" aria-label="${esc(links[id].label)}">${g}</a>`:g}).join('');
 const ghost=o.static?'':EDGES.map(([a,b])=>{const A=PAGES[a],B=PAGES[b],dx=(B.x-A.x)/2;return `<path class="ge" d="M${A.x},${A.y} C${A.x+dx},${A.y} ${B.x-dx},${B.y} ${B.x},${B.y}"/>`}).join('');
 return `<svg class="map${st}" viewBox="0 0 470 280" role="${o.alt?(Object.keys(links).length?'group':'img'):'presentation'}" ${o.alt?`aria-label="${esc(o.alt)}"`:'aria-hidden="true"'}>${ghost}${e}${n}</svg>`}
const stEl=(svg,p)=>$(`.st[data-p="${p}"]`,svg),edEl=(svg,a,b)=>$(`.ed[data-e="${a}-${b}"]`,svg);
/* ---------- the lab: a tiny shop, a cursor, and a map that draws itself ---------- */
let lab={running:false,paused:false,token:0,found:[],done:false};
const miniApp=()=>`<div class="win" id="win" data-page="home" data-wide="${bugs.wide?1:0}" data-about="${bugs.about?1:0}" data-look="${bugs.look?1:0}"><div class="chrome"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="urlpill" aria-hidden="true">localhost:3000</span></div>

$('.skip').addEventListener('click',e=>{e.preventDefault();const m=$('#main');m.focus();m.scrollIntoView()});
/* ---------- events ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-act],[data-filter],[data-seg],[data-dd],[data-dev],.tab');if(!t)return;
 if(t.id==='menubtn'){const o=$('#nav').classList.toggle('open');t.setAttribute('aria-expanded',o);return}
 if(t.id==='themebtn'){const i=THEMES.findIndex(x=>x[0]===S.theme);S.theme=THEMES[(i+1)%THEMES.length][0];applySettings();say('Theme: '+THEMES.find(x=>x[0]===S.theme)[1]);return}
 if(t.dataset.bug){const k=t.dataset.bug;bugs[k]=!bugs[k];store.set('bugs',bugs);t.setAttribute('aria-pressed',bugs[k]);$('.st',t).textContent=bugs[k]?'Broken':'Fine';const w=$('#win');if(w){w.dataset.wide=bugs.wide?1:0;w.dataset.about=bugs.about?1:0;w.dataset.look=bugs.look?1:0}say(`${BUGS[k].tog}: ${bugs[k]?'broken':'fine'}`);return}
 if(t.id==='addbreak'){openBreak();return}
 if(t.id==='labrun'){runLab();return}
 if(t.id==='labpause'){lab.paused=!lab.paused;t.setAttribute('aria-pressed',lab.paused);t.innerHTML=lab.paused?ic('play')+'Resume':ic('pause')+'Pause';say(lab.paused?'Paused':'Resumed');return}
 if(t.id==='runpause'){lab.paused=!lab.paused;t.setAttribute('aria-pressed',lab.paused);t.innerHTML=lab.paused?ic('play')+'Resume':ic('pause')+'Pause';return}
 if(t.classList.contains('tab')){showTab(+t.dataset.tab);t.focus();return}
 if(t.dataset.dev){$$('[data-dev]',$('#stage')).forEach(b=>b.tagName==='BUTTON'&&b.setAttribute('aria-pressed',b===t));const f=$('#frame');if(f)f.dataset.dev=t.dataset.dev;return}
 if(t.dataset.dd){demoDev=t.dataset.dd;$$('[data-dd]').forEach(b=>b.setAttribute('aria-pressed',b===t));$('#dframe').dataset.dev=demoDev;return}
 if(t.dataset.seg){demoSel=+t.dataset.seg;$$('[data-seg]').forEach(b=>b.setAttribute('aria-pressed',b===t));$('#cap').value=window._dl[demoSel];$('#dcap').textContent=window._dl[demoSel];return}
 if(t.dataset.filter){filter=t.dataset.filter;const y=scrollY;render();scrollTo(0,y);$(`[data-filter="${filter}"]`)?.focus();return}
 if(t.dataset.ex!==undefined){$('#ask-text').value=EX[+t.dataset.ex];$('#ask-text').focus();return}
 const a=t.dataset.act,k=t.dataset.k,st=$('#act-s');
 if(a==='askrun'){runAsk();return}
 if(a==='addflow'){const id='ai-'+(customFlows.length+1);const pages=t.dataset.pages.split(',');customFlows.push([id,t.dataset.name,pages,lineOf(pages),'ai']);store.set('customFlows',customFlows);t.disabled=true;$('#ask-s').innerHTML=`Added. <a href="#flow-${id}">Open the flow</a>`;say('Added to your flows');return}
 if(a==='breakflow'){openBreak(t.dataset.page);return}
 if(a==='ainame'){aiNameFlows();return}
 if(a==='aiapply'){FLOWS.forEach(f=>{if(AI_FLOWS[f[0]])aiNames[f[0]]=AI_FLOWS[f[0]][0]});store.set('aiNames',aiNames);say('Names applied');location.hash='#flows';render();return}
 if(a==='dismiss')return openDlg(`<h2 id="dlg-title" class="m">Accept as known?</h2><form method="dialog" style="margin-top:1rem">${['Known, fixing later','Intended behavior','Only in my test data'].map((r,i)=>`<label class="choice"><input type="radio" name="why" ${i===0?'checked':''}>${r}</label>`).join('')}<div class="row" style="margin-top:1rem"><button class="btn primary" value="ok">Accept it</button><button class="btn" value="cancel">Keep it</button></div></form>`,r=>{if(r==='ok'){dismissed[k]=true;store.set('dismissed',dismissed);location.hash='#results'}},t);
 if(a==='restore'){delete dismissed[k];store.set('dismissed',dismissed);render()}
 if(a==='cancel')return openDlg(`<h2 id="dlg-title" class="m">Stop this check?</h2><form method="dialog" class="row" style="margin-top:1rem"><button class="btn danger" value="stop">Stop</button><button class="btn primary" value="keep">Keep going</button></form>`,r=>{if(r==='stop'){lab.token++;run=null;location.hash='#new'}},t);
 if(a==='rerun'||a==='replay'){t.disabled=true;const m=$('#pathmap .map,#flowmap .map');st.textContent='Replaying…';say('Replaying');(async()=>{if(m&&!reduced()){const sts=$$('.st',m);for(const s of sts){s.classList.remove('hl');}for(const s of sts){if(!s.classList.contains('bad')||true){s.classList.add('hl');await sleep(350)}}}else await sleep(500);t.disabled=false;st.textContent=a==='rerun'?'It happened again.':'Passed.';say(st.textContent)})()}
 if(a==='copy'){const done=ok=>{$('#act-s').textContent=ok?'Copied.':'Couldn’t copy. Open “Show the test” and copy it.';say($('#act-s').textContent)};try{navigator.clipboard.writeText(reproFor(k)).then(()=>done(true),()=>done(false))}catch{done(false)}}
 if(a==='render'){t.disabled=true;$('#demo-out').innerHTML=`<progress max="100" value="40" aria-label="Recording"></progress>`;say('Recording');setTimeout(()=>{t.disabled=false;$('#demo-out').innerHTML=`<p class="chip good">${ic('check')}Demo ready</p><div class="row" style="margin-top:.6rem"><a class="btn" href="#demos" data-fake>demo.mp4</a><a class="btn" href="#demos" data-fake>captions.vtt</a></div>`;say('Demo ready')},1300)}
 if(a==='rmblock'){t.closest('li').remove();say('Removed')}
 if(a==='addblock'){const i=$('#newblock'),v=i.value.trim();if(v){const li=document.createElement('li');li.innerHTML='<span class="mono"></span><button data-act="rmblock">×</button>';li.firstChild.textContent=v;li.lastChild.setAttribute('aria-label','Remove '+v);$('#blocks').appendChild(li);i.value='';say('Added')}i.focus()}});
document.addEventListener('keydown',e=>{const t=e.target.closest&&e.target.closest('.tab');if(!t)return;const tabs=$$('.tab');let i=tabs.indexOf(t);if(['ArrowDown','ArrowRight'].includes(e.key))i=(i+1)%tabs.length;else if(['ArrowUp','ArrowLeft'].includes(e.key))i=(i-1+tabs.length)%tabs.length;else if(e.key==='Home')i=0;else if(e.key==='End')i=tabs.length-1;else return;e.preventDefault();showTab(i);tabs[i].focus()});
function openDlg(html,done,opener){const d=$('#dlg');d.innerHTML=html;d.showModal();d.addEventListener('close',function h(){d.removeEventListener('close',h);done(d.returnValue);opener&&document.contains(opener)&&opener.focus()})}
document.addEventListener('input',e=>{const t=e.target;if(t.id==='fq'){const rows=allFlows().filter(f=>f[1].toLowerCase().includes(t.value.toLowerCase()));$('#flowlist').innerHTML=flowList(rows);$('#fq-s').textContent=plural(rows.length,'flow')}
 if(t.id==='cap'){window._dl[demoSel]=t.value;$('#dcap').textContent=t.value;const b=$(`[data-seg="${demoSel}"] small`);if(b)b.textContent=secs(t.value).toFixed(1)+' s';$('#tot').textContent='About '+window._dl.reduce((a,l)=>a+secs(l),0).toFixed(0)+' seconds. Captions only for now.'}
 if(t.id==='url'){draft.url=t.value;const o=$('#own');if(o)o.hidden=isLocal(t.value)}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id&&t.id.startsWith('chk-')){CH[t.id.slice(4)]=t.checked;store.set('checks',CH);say(t.closest('label').textContent.trim()+(t.checked?': on':': off'))}
 if(t.name==='failon'){CH.failon=t.value;store.set('checks',CH);say('Fail the build on: '+t.closest('label').textContent.trim())}
 if(t.name==='scope'){draft.scope=t.value;$('#f-diff').hidden=t.value!=='diff';$('#f-goal').hidden=t.value!=='goal'}
 if(t.id==='sandbox'){draft.sandbox=t.checked;$('#sandbox-s').textContent=t.checked?'On':'Off'}if(t.id==='owncb')draft.own=t.checked;
 if(t.name==='theme'){S.theme=t.value;applySettings();$('#audit').innerHTML=auditRows();say('Theme: '+THEMES.find(x=>x[0]===t.value)[1])}
 if(t.name==='size'){S.size=+t.value;applySettings();say('Text size '+t.value+' percent')}
 if(t.id==='s-motion'){S.motion=t.checked?'reduce':'system';applySettings();$('#s-motion-s').textContent=t.checked?'On':'Follows device'}
 if(t.id==='s-ul'){S.underline=t.checked;applySettings();$('#s-ul-s').textContent=t.checked?'On':'Off'}
 if(t.id==='dflow'){window._dl=null;demoSel=0;location.hash='#demos-'+t.value}});
document.addEventListener('submit',e=>{if(e.target.closest('dialog'))return;   /* dialog forms close natively, with the pressed button as the result */
 e.preventDefault();const f=e.target;if(f.id==='askform'){runAsk();return}if(f.id!=='newform')return;const v=n=>f.elements[n].value.trim();draft.url=v('url');draft.base=v('base');draft.goal=v('goal');draft.success=v('success');const errs=[];
 $$('.err',f).forEach(x=>x.remove());$$('[aria-invalid]',f).forEach(x=>x.removeAttribute('aria-invalid'));
 const bad=(id,msg)=>{errs.push([id,msg]);$('#'+id).setAttribute('aria-invalid','true');$('#'+id+'-e').innerHTML=`<p class="err">${ic('x')}<span>${esc(msg)}</span></p>`};
 if(!draft.url)bad('url','Enter your app’s address.');else if(!isLocal(draft.url)&&!draft.own)bad('url',`“${draft.url.replace(/^https?:\/\//,'')}” isn’t on your computer. Confirm you own it, or use a local address.`);
 if(draft.scope==='diff'&&!draft.base)bad('base','Enter a branch, like main.');if(draft.scope==='goal'){if(!draft.goal)bad('goal','Describe the goal.');if(!draft.success)bad('success','Enter the text that shows it worked.')}
 const box=$('#errsum');if(errs.length){box.innerHTML=`<div class="summary-box" role="alert"><h2>${plural(errs.length,'thing')} to fix</h2><ul>${errs.map(([id,m])=>`<li><a href="#" data-jump="${id}">${esc(m)}</a></li>`).join('')}</ul></div>`;box.focus();return}
 store.set('draft',draft);run={};location.hash='#running'});
document.addEventListener('click',e=>{const j=e.target.closest('[data-jump]');if(j){e.preventDefault();const el=$('#'+j.dataset.jump);el.focus();el.scrollIntoView({block:'center'})}if(e.target.closest('[data-fake]'))e.preventDefault()});
applySettings();render();
</script>
</body>
</html>
